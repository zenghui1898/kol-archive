<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KOL 档案馆</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1115;color:#e6e6e6;overflow-x:hidden}
a{color:#7cc4ff;text-decoration:none}header{position:sticky;top:0;background:#151922;border-bottom:1px solid #262c38;z-index:5}
nav{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;font-size:14px}nav b{margin-right:auto}
main{overflow-wrap:anywhere;max-width:1100px;margin:auto;padding:16px 14px 60px}h1{font-size:26px;margin:.3em 0}h2{font-size:20px;margin:1.2em 0 .4em}h3{font-size:16px;margin:1em 0 .3em}
.card{background:#171b24;border:1px solid #262c38;border-radius:10px;padding:14px;margin:10px 0;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.muted{color:#8b93a3;font-size:13px}
.tag{display:inline-block;background:#232a38;border-radius:4px;padding:0 6px;margin:2px 3px 2px 0;font-size:12px}.f-ref,.f-fab{background:#5a2a2a}.f-own{background:#264d2e}.f-tpl,.f-tr{background:#4d4426}
.badge{display:inline-block;background:#1f2633;border-radius:8px;padding:8px 12px;margin:4px}.badge b{display:block;font-size:20px;color:#ffd479}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #262c38;padding:6px;text-align:left;vertical-align:top}.tbl{overflow-x:auto}
.r-对{color:#6fdc8c}.r-错{color:#ff7a7a}.r-部分对{color:#ffd479}input,select,button{background:#1f2633;color:#e6e6e6;border:1px solid #333b4b;border-radius:6px;padding:6px 8px;font-size:14px;max-width:100%}
.tw{overflow-wrap:anywhere;word-break:break-word;border-left:3px solid #333b4b;padding:6px 10px;margin:8px 0;white-space:pre-wrap}.tw.lv2{border-color:#ffd479}.tw.lv1{border-color:#7cc4ff}
.thumbs img{height:84px;margin:4px 4px 0 0;border-radius:4px;cursor:zoom-in;max-width:100%;object-fit:cover}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9}#lb img{max-width:96vw;max-height:94vh}
.loop{display:flex;flex-wrap:wrap;gap:8px}.loop .card{flex:1 1 150px;margin:0}.funnel span{display:inline-block;margin-right:14px}
blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid #ffd479;background:#1a1f2a}
</style></head><body>
<header><nav id="nav"></nav></header><main id="app">加载中…</main><div id="lb" onclick="this.style.display='none'"><img id="lbi" alt=""></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C={};async function J(u){if(!C[u]){const r=await fetch('./'+u);C[u]=await r.json()}return C[u]}
const pad=n=>String(n).padStart(2,'0');const X=i=>'https://x.com/0xAA_Science/status/'+i;
function lb(src){$('#lbi').src=src;$('#lb').style.display='flex'}
function nav(slug){$('#nav').innerHTML=`<b><a href="#home">KOL 档案馆</a></b><a href="#home">首页</a>`+(slug?`<a href="#${slug}">总览</a><a href="#${slug}.L01">讲义</a><a href="#${slug}.models">模型</a><a href="#${slug}.articles">长文</a><a href="#${slug}.score">记分卡</a><a href="#${slug}.archive">检索</a><a href="#${slug}.mentor">AI导师</a>`:'')+`<a href="#compare">横向对比</a><a href="#download">下载</a>`}
function twHTML(t,D){const[i,tm,k,x,q,lv,g,d,s,l,v,r,m,f,L,im]=t;return `<div class="tw lv${lv}"><div class="muted">${E(tm)} · ${E(k)} · ♥${l} 阅${v} · L${lv} ${g.map(a=>`<span class="tag">${E(a)}</span>`).join('')}${f.map(a=>`<span class="tag f-${a}">${a}</span>`).join('')}${L.length?' · 讲'+L.join(','):''} · <a href="${X(i)}" target="_blank" rel="noopener">原帖</a></div>${s?`<div><b>${E(s)}</b></div>`:''}${E(x)}${q?`<div class="muted">[引用] ${E(q.slice(0,300))}</div>`:''}${im&&im.length?`<div class="thumbs">${im.map(p=>`<img loading="lazy" src="images/0xaa/${p}" onclick="lb(this.src)" alt="截图">`).join('')}</div>`:''}</div>`}
async function home(){const K=await J('data/kols.json'),X2=await J('data/external.json');
return `<h1>KOL 档案馆</h1><p class="muted">把 KOL 推文做成可检索、可核对的讲义库。所有统计由脚本生成。</p><div class="grid">${K.map(k=>`<a class="card" href="#${k.slug}"><h3>${E(k.name)} <span class="muted">@${E(k.handle)}</span></h3><div class="muted">${E(k.type)}</div><p>${E(k.intro)}</p><div class="muted">${k.total.toLocaleString()} 条 · 干货 ${k.good} · 核心 ${k.core} · ${k.lectures} 讲 · 记分 对${k.score.right}/错${k.score.wrong}/部分${k.score.partial}/待${k.score.pending}</div><div class="muted">${k.from} → ${k.to}</div></a>`).join('')}</div>
<h2>外部档案（仅外链）</h2>${X2.map(s=>`<div class="card"><b>${E(s.source)}</b> <span class="muted">by ${E(s.by)}</span><p class="muted">${E(s.intro)}</p>${s.items.map(it=>`<a class="tag" href="${it.url}" target="_blank" rel="noopener">${E(it.name)} @${E(it.handle)}</a>`).join('')}</div>`).join('')}${await dl()}`}
async function dl(){const K=await J('data/kols.json');return `<h2 id="download">数据湖下载</h2><div class="card">${K.map(k=>`<div><b>${E(k.name)}</b>：<a href="data/${k.slug}_tweets.csv" download>清洗推文 CSV</a> · <a href="data/${k.slug}_models.json" download>思维模型 JSON</a> · <a href="data/${k.slug}_articles.json" download>长文 JSON</a> · <a href="data/${k.slug}.json" download>全量档案 JSON</a></div>`).join('')}</div>`}
async function overview(slug){const D=await J(`data/${slug}.json`),M=D.meta,S=D.scoreSum;
return `<h1>${E(M.hero)}</h1><p class="muted">@${E(M.handle)} · ${E(M.type)} · ${M.from} → ${M.to} · 构建 ${M.built}</p><p>${E(M.lede)}</p>
<div>${M.badges.map(b=>`<span class="badge"><b>${E(b.v)}</b>${E(b.k)}</span>`).join('')}</div>
<h2>决策闭环</h2><div class="loop">${M.loopDetail.map((x,n)=>`<div class="card"><b>${n+1}. ${E(x.name)}</b><div class="muted">${E(x.desc)}</div><a href="#${slug}.L${pad(D.outline.vols.find(v=>v.v==x.vol).lec[0][0])}">→ 第${x.vol}卷</a></div>`).join('')}</div>
<h2>卷 / 讲目录</h2>${D.outline.vols.map(v=>`<div class="card"><b>第${v.v}卷 · ${E(v.name)}</b> <span class="muted">${v.step?'闭环第'+v.step+'步':'背景'}</span>${v.lec.map(([n,t,k])=>`<div><a href="#${slug}.L${pad(n)}">L${pad(n)} ${E(t)}</a> <span class="muted">${E(k)}</span></div>`).join('')}</div>`).join('')}
<h2>数据漏斗</h2><div class="card funnel"><span>全部 <b>${M.total.toLocaleString()}</b></span><span>预筛 <b>${M.cand.toLocaleString()}</b></span><span>干货 lv≥1 <b>${M.good}</b></span><span>核心 lv2 <b>${M.core}</b></span><div class="muted">可信度标记占比：${Object.entries(M.flags).map(([k,v])=>k+' '+v+'%').join(' · ')}</div><div class="muted">${E(M.tagging)}</div></div>
<h2>记分卡摘要</h2><div class="card">共 ${S.total} 条，可验证 ${S.verifiable}：对 ${S.right} · 错 ${S.wrong} · 部分对 ${S.partial} · 未到期 ${S.pending}<p>${E(S.insight)}</p><a href="#${slug}.score">查看全部 →</a></div>
<div class="card muted">${E(M.note)}</div>`}
async function lecture(slug,n){const D=await J(`data/${slug}.json`),T=Object.fromEntries(D.tw.map(t=>[t[0],t]));const l=D.lec.find(x=>x.n==n);if(!l)return '<p>无此讲</p>';
const v=D.outline.vols.find(v=>v.lec.some(x=>x[0]==n));const nx=D.lec.find(x=>x.n==n+1),pv=D.lec.find(x=>x.n==n-1);
const sec=s=>E(s).replace(/【([^】]+)】/g,'</p><h3>【$1】</h3><p>');
return `<div class="muted">第${v.v}卷 · ${E(v.name)}</div><h1>L${pad(n)} ${E(l.title)}</h1><div class="muted">⏱️ 研读约 ${l.readMin} 分钟 · 📝 关联原推 ${l.relCount} 篇</div>
<div class="card"><b>核心问题：</b>${E(l.question)}<ol>${l.takeaways.map(t=>`<li>${E(t)}</li>`).join('')}</ol></div>
<h2>深度拆解</h2><div class="card"><h3>现象</h3><p>${sec(l.deep.phenomenon)}</p><h3>机制</h3><p>${sec(l.deep.mechanism)}</p><h3>规则</h3><ul>${l.deep.rules.map(r=>`<li>${E(r)}</li>`).join('')}</ul></div>
${l.cases.length?`<h2>案例</h2>${l.cases.map(c=>`<div class="card"><b>${E(c.name)}</b><div>发现：${E(c.discover)}</div><div>进场：${E(c.entry)}</div><div>持有：${E(c.hold)}</div><div>退出：${E(c.exit)}</div><div>教训：${E(c.lesson)}</div>${c.ids.map(i=>`<a href="${X(i)}" target="_blank" rel="noopener">原帖</a>`).join(' ')}</div>`).join('')}`:''}
<h2>时间证据链</h2><div class="card">${l.timeline.map(t=>`<div><span class="muted">${t.date}</span> ${E(t.note)} <a href="${X(t.id)}" target="_blank" rel="noopener">↗</a></div>`).join('')}</div>
<h2>必读原推</h2>${l.lead.map(x=>T[x.id]?twHTML(T[x.id],D):'').join('')}
<h2>GMGN 对照</h2><div class="card"><b>借鉴</b><ul>${l.gmgn.borrow.map(x=>`<li>${E(x)}</li>`).join('')}</ul><b>过滤</b><ul>${l.gmgn.filter.map(x=>`<li>${E(x)}</li>`).join('')}</ul><b>护栏</b><p>${E(l.gmgn.guard)}</p></div>
<h2>局限与翻车</h2><div class="card">${E(l.limits)}</div><blockquote>「${E(l.quote.text)}」 <a href="${X(l.quote.id)}" target="_blank" rel="noopener">原帖</a></blockquote>
<p>${pv?`<a href="#${slug}.L${pad(pv.n)}">← L${pad(pv.n)}</a>`:''} &nbsp; ${nx?`<a href="#${slug}.L${pad(nx.n)}">L${pad(nx.n)} →</a>`:''}</p>`}
async function models(slug){const D=await J(`data/${slug}.json`);return `<h1>核心思维模型</h1>${D.models.map(m=>`<div class="card"><b>${m.id} ${E(m.name)}</b><p>${E(m.desc)}</p><blockquote>「${E(m.quote.text)}」 <a href="${X(m.quote.id)}" target="_blank" rel="noopener">原帖</a></blockquote><div class="muted">关联讲：${m.lec.map(n=>`<a href="#${slug}.L${pad(n)}">L${pad(n)}</a>`).join(' ')}</div></div>`).join('')}`}
async function articles(slug){const D=await J(`data/${slug}.json`);return `<h1>长文研报</h1><p class="muted">X Article 共 ${D.articles.length} 篇；导出未含全文的只列标题+摘录+原帖链接。</p>${D.articles.map(a=>`<div class="card"><b>${E(a.title)}</b> <span class="muted">${a.date} · ${a.chars} 字 · 约 ${a.readMin} 分钟 · ${a.full?'全文':E(a.note)}</span><div class="tw">${E(a.text)}</div><a href="${a.url}" target="_blank" rel="noopener">原帖</a></div>`).join('')}`}
async function score(slug){const D=await J(`data/${slug}.json`),S=D.scoreSum;return `<h1>预测记分卡</h1><div class="card">共 ${S.total} · 可验证 ${S.verifiable} · 对 ${S.right} · 错 ${S.wrong} · 部分对 ${S.partial} · 未到期 ${S.pending}<p>${E(S.insight)}</p><div class="muted">${Object.entries(S.by_domain).map(([k,v])=>k+'：'+(Object.entries(v).map(([a,b])=>a+b).join(' ')||'—')).join('　')}</div></div>
<div class="tbl"><table><tr><th>日期</th><th>标的</th><th>预测</th><th>结果</th><th>证据</th></tr>${D.score.map(s=>`<tr><td>${s.date}</td><td>${E(s.asset)}</td><td>${E(s.claim)} <a href="${X(s.id)}" target="_blank" rel="noopener">↗</a></td><td class="r-${s.result}">${s.result}</td><td>${E(s.evidence)} ${s.src?`<a href="${E(s.src)}" target="_blank" rel="noopener">出处</a>`:''}</td></tr>`).join('')}</table></div>`}
let AQ={q:'',lv:'',g:'',y:'',f:'',p:0};
async function archive(slug){const D=await J(`data/${slug}.json`);const tags=[...new Set(D.tw.flatMap(t=>t[6]))].sort(),yrs=Object.keys(D.meta.years);
setTimeout(()=>arun(slug),0);return `<h1>全文检索</h1><div class="card"><input id="aq" placeholder="关键词" value="${E(AQ.q)}" style="width:220px"> <select id="alv"><option value="">层级</option><option value="2">L2 核心</option><option value="1">L1+ 干货</option><option value="0">L0</option></select> <select id="ag"><option value="">主题</option>${tags.map(t=>`<option>${E(t)}</option>`).join('')}</select> <select id="ay"><option value="">年份</option>${yrs.map(y=>`<option>${y}</option>`).join('')}</select> <select id="af"><option value="">可信度</option><option>ref</option><option>tpl</option><option>tr</option><option>fab</option><option>own</option><option value="clean">无标记</option></select> <label class="muted"><input type="checkbox" id="ai"> 仅含截图</label></div><div id="ares"></div>`}
function arun(slug){const D=C[`data/${slug}.json`];const g=id=>$('#'+id);if(!g('aq'))return;const up=()=>{AQ={q:g('aq').value.trim(),lv:g('alv').value,g:g('ag').value,y:g('ay').value,f:g('af').value,im:g('ai').checked,p:0};render()};
['aq','alv','ag','ay','af','ai'].forEach(id=>g(id).oninput=up);g('alv').value=AQ.lv;g('ag').value=AQ.g;g('ay').value=AQ.y;g('af').value=AQ.f;
function render(){const q=AQ.q.toLowerCase();let R=D.tw.filter(t=>(!q||t[3].toLowerCase().includes(q)||t[8].toLowerCase().includes(q))&&(AQ.lv===''||(AQ.lv==='1'?t[5]>=1:t[5]==AQ.lv))&&(!AQ.g||t[6].includes(AQ.g))&&(!AQ.y||t[1].startsWith(AQ.y))&&(!AQ.f||(AQ.f==='clean'?!t[13].length:t[13].includes(AQ.f)))&&(!AQ.im||t[15].length));
R=R.slice().reverse();const page=R.slice(0,(AQ.p+1)*50);g('ares').innerHTML=`<div class="muted">命中 ${R.length} 条</div>`+page.map(t=>twHTML(t,D)).join('')+(R.length>page.length?`<button id="amore">更多</button>`:'');const m=g('amore');if(m)m.onclick=()=>{AQ.p++;render()}}render()}
async function mentor(slug){const D=await J(`data/${slug}.json`);setTimeout(()=>{const go=()=>{const q=$('#mq').value.trim();if(!q){return}const ws=q.replace(/[？?，,。！!]/g,' ').split(/\s+/).filter(Boolean);const terms=ws.length>1?ws:[...new Set(q.match(/[\u4e00-\u9fa5]{2}|[A-Za-z$0-9]{2,}/g)||[])];
const sc=x=>terms.reduce((a,w)=>a+(x.toLowerCase().includes(w.toLowerCase())?1:0),0);
const mm=D.models.map(m=>[sc(m.name+m.desc+m.quote.text),m]).filter(a=>a[0]).sort((a,b)=>b[0]-a[0]).slice(0,2);const ar=D.articles.map(a=>[sc(a.title+a.text),a]).filter(a=>a[0]).slice(0,1);
const tw=D.tw.filter(t=>t[5]>=1).map(t=>[sc(t[3])+t[5]*0.5,t]).filter(a=>a[0]>=1).sort((a,b)=>b[0]-a[0]).slice(0,6);
$('#mres').innerHTML=(mm.length?'<h3>相关思维模型</h3>'+mm.map(([_,m])=>`<div class="card"><b>${m.id} ${E(m.name)}</b> ${E(m.desc)}</div>`).join(''):'')+(ar.length?'<h3>相关长文</h3>'+ar.map(([_,a])=>`<div class="card">${E(a.title)}</div>`).join(''):'')+'<h3>档案原推（出处）</h3>'+(tw.length?tw.map(([_,t])=>twHTML(t,D)).join(''):'<p>档案里没谈过。</p>')};$('#mgo').onclick=go;$('#mq').onkeydown=e=>{if(e.key==='Enter')go()}},0);
return `<h1>AI 导师 · 本地检索版</h1><div class="card muted">大模型问答暂不可用（不在前端放任何 API Key）。当前为本地检索：只从档案推文、思维模型、长文中找出处返回，不生成观点。${E(D.meta.note)}</div><div class="card"><input id="mq" placeholder="例如：翻倍 回本" style="width:70%"> <button id="mgo">检索</button><div class="muted">推荐：${D.meta.sugg.map(s=>E(s)).join(' / ')}</div></div><div id="mres"></div>`}
async function compare(){const K=await J('data/kols.json');const Ds=await Promise.all(K.map(k=>J(`data/${k.slug}.json`)));const tags=[...new Set(Ds.flatMap(D=>D.tw.flatMap(t=>t[6])))].sort();
return `<h1>横向对比</h1><p class="muted">按公共主题词表统计各 KOL 干货（lv≥1）条数；目前仅收录 ${K.length} 位，其他 KOL 待接入。外部档案不参与对比。</p><div class="tbl"><table><tr><th>主题</th>${K.map(k=>`<th>${E(k.name)}</th>`).join('')}</tr>${tags.map(g=>`<tr><td>${E(g)}</td>${Ds.map((D,j)=>{const n=D.tw.filter(t=>t[5]>=1&&t[6].includes(g)).length;const l=D.lec.filter(l=>l.kw.includes(g.slice(0,2))).map(l=>l.n);return `<td>${n}${l.length?' · '+l.map(x=>`<a href="#${K[j].slug}.L${pad(x)}">L${pad(x)}</a>`).join(' '):''}</td>`}).join('')}</tr>`).join('')}</table></div>`}
async function route(){$('#lb').style.display='none';const h=(location.hash||'#home').slice(1);const[slug,sub]=h.split('.');let html;
try{if(h==='home'||!h){nav();html=await home()}else if(h==='compare'){nav();html=await compare()}else if(h==='download'){nav();html=await dl()}
else{const K=await J('data/kols.json');if(!K.some(k=>k.slug===slug)){nav();html='<p>未找到该档案</p>'}else{nav(slug);
if(!sub)html=await overview(slug);else if(/^L\d+$/.test(sub))html=await lecture(slug,+sub.slice(1));else if(sub==='models')html=await models(slug);else if(sub==='articles')html=await articles(slug);
else if(sub==='score')html=await score(slug);else if(sub==='archive')html=await archive(slug);else if(sub==='mentor')html=await mentor(slug);else html='<p>未知页面</p>'}}}catch(e){html='<p>加载失败：'+E(e.message)+'</p>';console.error(e)}
$('#app').innerHTML=html;scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
